<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>OFFLINE</title>

<link rel="stylesheet" href="style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;800&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

</head>

<body>

<div class="background"></div>

<section id="opening" class="screen active">

    <div class="container">

        <h1 class="logo">
            OFFLINE
        </h1>

        <button id="initializeBtn">
            START VANDALIZING
        </button>

    </div>

</section>

<section id="loading" class="screen">

    <div class="container">

        <h2>
            ARCHIVES LOADING
        </h2>

        <div class="loading-bar">

            <div id="progress"></div>

        </div>

        <p id="loadingText">
            0%
        </p>

    </div>

</section>

<section id="unit" class="screen">

    <div class="container">

        <h2>
            CHOOSE YOUR CREW
        </h2>

        <button class="unit-btn" data-unit="CONCLAVE">
            CONCLAVE
        </button>

        <button class="unit-btn" data-unit="DISSIDENCE">
            DISSIDENCE
        </button>

        <button class="unit-btn" data-unit="DISSONANCE">
            DISSONANCE
        </button>

    </div>

</section>

<section id="register" class="screen">

    <div class="container">

        <h2>
            ENTER YOUR DETAILS
        </h2>

        <input
        id="playerName"
        type="text"
        placeholder="Player Name">

        <input
        id="playerPort"
        type="text"
        placeholder="Player Port">

        <button id="continueBtn">
            OPEN YOUR SPACE
        </button>

    </div>

</section>

<section id="menu" class="screen">

<div class="container">

<h2>
YOUR SPACE
</h2>

<div class="profile">

<p>

<strong>Name:</strong>

<span id="displayName"></span>

</p>

<p>

<strong>Port:</strong>

<span id="displayPort"></span>

</p>

<p>

<strong>Unit:</strong>

<span id="displayUnit"></span>

</p>

</div>

<button id="changeBtn">
ALTER
</button>

<button id="addBtn">
APPEND
</button>

<button id="hiatusBtn">
DORMANT
</button>

<button id="leaveBtn">
VANISH
</button>

</div>

</section>

<section id="form" class="screen">

<div class="container">

<h2 id="formTitle">

PETITION

</h2>

<div id="formFields">

</div>

<div class="button-group">

<button id="submitBtn">

SEND IT

</button>

<button id="cancelBtn">

BACK OFF

</button>

</div>

</div>

</section>

<section id="success" class="screen">

<div class="container">

<h2>

REQUEST TRANSMITTED

</h2>

<p>

STATUS: <span id="status"></span>

</p>

<strong align="center">

PENDING COUNCIL JUDGMENT

</strong>

<button id="menuReturn">

RETURN TO MY SPACE

</button>

</div>

</section>

<script src="script.js"></script>

</body>

</html>
